name: Publish

# Stages a release on npm through trusted publishing (OIDC): no npm token
# is stored in the repository. npmjs.com must list this repository and
# publish.yml as the package's trusted publisher. The trusted publisher
# may only stage, so a maintainer approves each version with 2FA, on
# npmjs.com or with `npm stage approve <stage-id>`, before it goes live.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs npm test (build and the full suite) first.
      - run: npm stage publish --provenance
